name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to retry, for example mdtheme-v0.1.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    name: release please
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Events created with the built-in GITHUB_TOKEN do not start new
          # workflow runs. Provide a GitHub App token or PAT when CI has to run
          # on the release PR itself.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish-npm:
    name: publish to npm
    needs: release-please
    if: >-
      ${{ !cancelled() && (
        (github.event_name == 'push' && needs.release-please.outputs.releases_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      # Retries must identify a release tag, never a branch or arbitrary commit.
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          expected="mdtheme-v$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "$expected"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Use a pinned npm CLI with Trusted Publishing support.
      - run: npm install --global npm@12.0.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm agent:check

      - uses: sebastian-software/standards/.github/actions/publish-npm@418631be284b9e7141a140c2c49a9d615b5cd6dc # v0.10.0
        with:
          packages: .
