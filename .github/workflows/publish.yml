name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Draft release tag to retry (run the workflow from that tag)"
        required: true
        type: string
      publish_crate:
        description: "Also publish this release to crates.io (requires CARGO_REGISTRY_TOKEN)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mdtheme-release
  cancel-in-progress: false

jobs:
  release-please:
    name: release please
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Events created with the built-in GITHUB_TOKEN do not start new
          # workflow runs. Provide a GitHub App token or PAT when CI has to run
          # on the release PR itself.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  release-state:
    needs: release-please
    if: >-
      ${{ !cancelled() && (
        (github.event_name == 'push' && needs.release-please.outputs.releases_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      ) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub requires push access to read draft releases.
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify draft and workflow source identity
        shell: bash
        run: |
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          python3 scripts/release-assets.py --check-draft "$RELEASE_TAG"

  binaries:
    needs: [release-please, release-state]
    if: ${{ !cancelled() && needs.release-state.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify release tag
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          test "$RELEASE_TAG" = "mdtheme-v$version"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - name: Build native binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add "$TARGET"
          cargo test --locked --workspace --all-features
          cargo run --locked -- --check
          cargo build --release --locked --target "$TARGET"
          mkdir artifact
          binary=mdtheme
          if [[ "$TARGET" == *windows* ]]; then binary=mdtheme.exe; fi
          tar -czf "artifact/mdtheme-$TARGET.tar.gz" -C "target/$TARGET/release" "$binary"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: artifact/*

  release-assets:
    needs: [release-please, binaries]
    if: ${{ !cancelled() && needs.binaries.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifact
          merge-multiple: true
      - name: Generate checksums and Homebrew formula
        run: |
          cd artifact
          cp ../install.sh .
          python3 ../scripts/homebrew-formula.py "$RELEASE_TAG" > mdtheme.rb
          sha256sum *.tar.gz install.sh mdtheme.rb > SHA256SUMS
      - name: Attest native archives, installer, and formula
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: artifact/SHA256SUMS
      - name: Upload complete draft and publish
        run: python3 scripts/release-assets.py "$RELEASE_TAG" artifact

  publish-crate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_crate }}
    needs: release-assets
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - run: test -n "$CARGO_REGISTRY_TOKEN"
      - run: rustup toolchain install stable --profile minimal
      - run: cargo publish --locked
