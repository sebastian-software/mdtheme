name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Verify native CLI and packaged consumer
        shell: bash
        run: sh scripts/check.sh
      - name: Test installer
        if: runner.os != 'Windows'
        run: python3 scripts/test-installer.py

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the declared minimum Rust version
        shell: bash
        run: |
          msrv=$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" test --locked --workspace --all-features
